<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101326" />
  <title>Hello, World — A Little Spark</title>
  <style>
    :root { color-scheme: dark; --ink: #f8f7ff; --muted: #b8bad1; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden;
      color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 18% 18%, #333268 0, transparent 35%),
                  radial-gradient(ellipse at 85% 80%, #1c5870 0, transparent 36%), #101326;
    }
    .glow { position: fixed; width: 28rem; aspect-ratio: 1; border-radius: 50%; filter: blur(100px); opacity: .24; pointer-events: none; }
    .glow.one { background: #a06bff; top: -13rem; right: -7rem; }
    .glow.two { background: #31d7ca; bottom: -16rem; left: -8rem; }
    main {
      position: relative; width: min(90vw, 760px); padding: clamp(2rem, 7vw, 5rem);
      text-align: center; border: 1px solid rgba(255,255,255,.15); border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 30px 100px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(18px); animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .spark { display: inline-grid; place-items: center; width: 70px; height: 70px; margin-bottom: 1.6rem;
      border: 1px solid rgba(255,255,255,.22); border-radius: 22px; font-size: 2rem;
      background: linear-gradient(135deg, rgba(179,136,255,.3), rgba(73,225,218,.18));
      box-shadow: 0 10px 35px rgba(145,116,255,.2); }
    .eyebrow { margin: 0 0 .8rem; color: #c8b6ff; font-size: .76rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.2rem, 10vw, 6.8rem); line-height: .98; letter-spacing: -.075em; }
    h1 span { display: block; color: transparent; background: linear-gradient(100deg, #c5a7ff 10%, #f7efff 48%, #7de7df 92%); background-clip: text; }
    .intro { max-width: 39ch; margin: 1.5rem auto 0; color: var(--muted); font-size: clamp(1rem, 2.3vw, 1.15rem); line-height: 1.75; }
    .rule { width: 48px; height: 3px; margin: 2rem auto 1.3rem; border-radius: 9px; background: linear-gradient(90deg,#b99bff,#69e3db); }
    .note { margin: 0; color: #ddd9ee; font-size: .9rem; }
    .note b { color: #a9eee7; font-weight: 600; }
    nav { display: flex; justify-content: center; gap: .7rem; margin-top: 1.8rem; }
    nav a { color: var(--ink); text-decoration: none; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: .7rem 1rem; font-size: .9rem; transition: background .2s, border-color .2s; }
    nav a:hover, nav a:focus-visible { background: rgba(255,255,255,.1); border-color: rgba(125,231,223,.65); }
    @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div><div class="glow two" aria-hidden="true"></div>
  <main>
    <div class="spark" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something for the web</p>
    <h1>Hello,<span>World!</span></h1>
    <p class="intro">Every great idea starts somewhere. Here’s to the first line, the next big thing, and all the bright possibilities in between.</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="note">Made with <b>curiosity</b> and a touch of sparkle.</p>
    <nav aria-label="Main navigation"><a href="about.html">About us</a><a href="contact.html">Contact</a></nav>
  </main>
</body>
</html>
